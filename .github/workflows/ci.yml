name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install (CPU-only PyTorch keeps this fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt ruff

      - name: Lint (syntax errors, undefined names, unused imports)
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 .

      - name: Train the behaviour model (synthetic data, no downloads)
        run: python eval/train_behaviour.py

      - name: Tests
        run: pytest tests -q
